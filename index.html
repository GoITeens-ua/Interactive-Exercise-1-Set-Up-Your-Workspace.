/* Digital Start — навчальна оболонка; Windows зберігає системний стиль. */
:root{--purple:#7C3AED;--blue:#2563EB;--lime:#A6E635;--text:#233855;--border:#D9E3F3;--sans:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
body{background:radial-gradient(ellipse at 0 0,#ede5ff,transparent 40%),linear-gradient(160deg,#F8FAFC,#eef5ff);color:var(--text);font-family:var(--sans)}
.pc{font-family:"Segoe UI",Arial,sans-serif}
.app{max-width:1450px;padding:18px}
.heading{position:sticky;top:0;background:#fafbffF5;border:1px solid var(--border);border-radius:18px;padding:14px 18px;box-shadow:0 8px 25px #2338550d;backdrop-filter:blur(10px);margin-bottom:16px}
.heading .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;color:var(--purple)}
.heading h1{font-family:var(--mono);font-size:25px;color:var(--text);line-height:1.25;margin:6px 0 10px}
.heading .tag{display:none}
.skill-collection{gap:8px;flex-wrap:wrap}
.skill-head{font-family:var(--mono);color:#52647c}.skill-head span:first-child{display:none}
.skill-grid{gap:5px;flex-wrap:wrap}.skill-chip{width:30px;height:30px;background:#edf2fa;border:1px solid #dce5f2;border-radius:9px;font-size:18px}.skill-chip.earned{background:#e8f8c9;border-color:#A6E635;color:#365314}
.layout{align-items:start}.side{border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 12px 30px #2338550b;padding:18px;gap:14px}
.stepnum{font-family:var(--mono);color:var(--purple);font-weight:700}.progress{height:8px;background:#e9eef7}.progress div{background:var(--lime);border-radius:999px}.side h2{font-family:var(--mono);color:var(--text);font-size:20px;line-height:1.35}.side p{color:#45546b}
.checks{gap:10px}.check.done{color:#365314}.check.done .mark{background:var(--lime);border-color:#84bd23;color:#23400b}.feedback{border-radius:12px;background:#eef5ff;border-color:#d9e6fa;color:#233855;min-height:0}.feedback.good{background:#effbdc;border-color:#c5e78d;color:#365314}.feedback.warn{background:#fff9e8;border-color:#efdaa5}.feedback small{display:none}
.side-actions{flex-wrap:wrap}.side-actions button{min-height:42px;border-radius:12px;font-weight:700;padding:10px 14px}.side-actions #hintBtn{background:var(--purple);border:1px solid var(--purple);color:white;flex:1}.side-actions #hintBtn:hover{background:#6930d3}.side-actions #resetBtn{background:white;border:1px solid var(--border);color:var(--text)}.side-actions #hintBtn:disabled{opacity:.5;cursor:default}
.keys{color:#52647c;margin-top:10px;font-size:12px}.keys button{border-color:#d8c9f8;color:#5729b8;border-radius:8px;padding:7px 10px;font-weight:650}.keys button:hover{background:#f2eaff}.keys span:last-child{flex-basis:100%}
.reward-layer{background:#19274588}.reward-card{border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,#fff,#f8fbff);padding:26px;box-shadow:0 30px 70px #1f2f4a38}.reward-icon{width:76px;height:76px;font-size:40px;background:#e8f8c9;border:1px solid #c3e98a;border-radius:22px;margin:0 auto 15px;line-height:1}.reward-kicker{font-family:var(--mono);color:var(--purple);font-weight:700}.reward-card h2{font-family:var(--mono);color:var(--text);font-size:23px;line-height:1.3;margin:12px 0}.reward-card p{margin:10px 0;line-height:1.55}.reward-card button{min-height:44px;border-radius:12px;background:var(--lime);color:#233855;box-shadow:0 6px 16px #84bd2322}.reward-card button:hover{background:#95d52a}.reward-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}.reward-list:empty{display:none}.reward-list div{background:#e8f8c9;border:1px solid #c3e98a;border-radius:10px;min-height:42px;display:grid;place-items:center;font-size:23px;line-height:1;padding:8px 4px}
.heading button:focus-visible,.side button:focus-visible,.keys button:focus-visible,.reward-card button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
@media(max-width:790px){.app{padding:10px}.heading{padding:12px;position:relative}.heading h1{font-size:21px}.side{gap:10px;padding:14px}.skill-chip{width:26px;height:26px;font-size:16px}}
@media(max-width:480px){.heading h1{font-size:18px}.reward-card{padding:20px}.reward-card h2{font-size:20px}}

function make(k){let e=document.createElement('section');e.className='window';e.id='win-'+k;e.dataset.app=k;e.innerHTML=`<div class="titlebar">${ico(k)}<span class="title">${titles[k]}</span><div class="controls"><button data-action="min" title="Згорнути — тимчасово сховати вікно" aria-label="Згорнути">−</button><button data-action="max" title="Відновити розмір" aria-label="Відновити розмір">❐</button><button data-action="close" class="close" title="Закрити — завершити роботу програми" aria-label="Закрити">×</button></div></div><div class="body">${body(k)}</div>${['n','s','e','w','ne','nw','se','sw'].map(x=>`<div class="resize ${x}" data-edge="${x}"></div>`).join('')}`;$('windows').appendChild(e);e.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.controls'))focus(k,false)});e.querySelector('.titlebar').addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;startDrag(ev,k,'move')});e.querySelector('.titlebar').addEventListener('dblclick',ev=>{if(!ev.target.closest('button'))toggleMax(k)});e.querySelectorAll('.resize').forEach(el=>el.addEventListener('pointerdown',ev=>startDrag(ev,k,el.dataset.edge)));e.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>({min:()=>min(k),max:()=>toggleMax(k),close:()=>closeApp(k)})[btn.dataset.action]());if(k==='calc')e.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calc(b.dataset.calc));return e}

function focus(k,announce=true){let s=state[k];if(!s?.open)return; if(hiddenDesk){hiddenDesk=false;for(let a of Object.keys(state))state[a].deskHide=false;Object.keys(state).forEach(draw)}s.min=false;s.deskHide=false;s.z=++z;active=k;draw(k);taskbar();if(announce){feedback('Відкрито вікно «'+names[k]+'». Інші програми залишаються запущеними.');if(stage===3&&k==='folder')flags.folderFound=true;check()}}
function launch(k,source){hideMenus();if(stage===0){let next=['folder','calc','chrome'].find(a=>!opened[a]);if(next&&k!==next&&!state[k]?.open){feedback('Спочатку відкрий «'+names[next]+'».','warn');return}}if(state[k]?.open){focus(k);return}let w=Math.min(480,Math.max(220,W()*.57)),h=Math.min(H()-30,410);state[k]={open:true,min:false,deskHide:false,max:true,rect:{x:Math.max(8,(W()-w)/2),y:55,w,h},z:++z};if(!$('win-'+k))make(k);if((k==='chrome'&&source==='taskbar')||(k==='calc'&&source==='start')||(k==='folder'&&source==='desktop'))opened[k]=true;if(stage===7&&k==='calc'){if(source==='start'&&flags.unpinnedClosed)flags.reopenedStart=true;if(source==='taskbar'&&flags.pinnedClosed&&pinned.calc)flags.reopenedTaskbar=true;}focus(k,false);feedback(names[k]+' відкрито у розгорнутому вигляді.'+(stage===0&&k!=='folder'?' Наступну програму можна відкрити, не закриваючи цю.':''),'good');check()}
function toggleMax(k){let s=state[k];if(!s?.open)return;focus(k,false);s.max=!s.max;if(stage===4&&k==='folder'){if(!s.max){flags.folderRestored=true;flags.folderMax=false;}else if(flags.folderRestored){flags.folderMax=true;}}if(!s.max){restored[k]=true;feedback('Відновлено розмір вікна. Тепер його можна перетягувати та змінювати за краї.','good')}else feedback('Вікно розгорнуто на весь екран. Інші програми залишилися відкритими.');draw(k);check()}
function min(k,source='button'){let s=state[k];if(!s?.open)return;s.min=true;draw(k);active=topVisible();taskbar();if(stage===2&&k==='chrome'&&source==='button'){minimizedChrome=true;feedback('Chrome згорнуто, але не закрито. Поверни його через панель завдань.','good')}else feedback(names[k]+' згорнуто. Щоб повернути вікно, натисни його значок на панелі завдань.');check()}
function closeApp(k){let s=state[k];if(!s?.open)return;if(stage===7&&k==='calc'){if(!pinned.calc&&!flags.reopenedStart)flags.unpinnedClosed=true;else if(pinned.calc&&flags.didPin&&flags.reopenedStart)flags.pinnedClosed=true;}s.open=false;delete opened[k];delete restored[k];if(k==='chrome'){minimizedChrome=false;returnChrome=false}draw(k);active=topVisible();taskbar();if(stage===7&&k==='calc'){feedback(pinned.calc?'Калькулятор закрито. Закріплений значок залишився — запусти програму з панелі завдань.':'Калькулятор закрито, значок зник. Тепер знайди його через «Пуск».','good');check();return}feedback('Вікно закрито. Для поточного завдання потрібно залишити програми відкритими — запусти «'+names[k]+'» знову.','warn');check()}
function showDesktop(){hideMenus();if(!hiddenDesk){if(stage===6)flags.deskShown=['chrome','calc','folder'].every(visible);hiddenDesk=true;deskSnapshot=Object.keys(state).filter(visible);for(let k of deskSnapshot){state[k].deskHide=true;draw(k)}active=null;feedback('Робочий стіл видно. Вікна тимчасово приховані, а не закриті.')}else{if(stage===6&&flags.deskShown)flags.deskReturned=true;hiddenDesk=false;for(let k of Object.keys(state)){state[k].deskHide=false;draw(k)}active=topVisible();feedback('Вікна повернулися на екран.','good')}taskbar();check()}
function startMenu(){let was=$('start').hidden;hideMenus();if(was){$('start').hidden=false;$('search').value='';renderStart();$('search').focus();feedback('')}}
function renderStart(){let q=$('search').value.trim().toLowerCase();let entries=[['calc','Калькулятор'],['chrome','Google Chrome'],['folder','Провідник'],['settings','Параметри'],['note','Блокнот'],['photos','Фотографії'],['store','Microsoft Store'],['mail','Пошта']];if(q)entries=entries.filter(([k,n])=>n.toLowerCase().includes(q)|| (k==='calc'&&'calculator'.includes(q)));$('startHeading').textContent=q?'Результати пошуку':'Закріплені';$('recommend').hidden=!!q;$('recent').hidden=!!q;$('apps').innerHTML=entries.map(([k,n])=>`<button class="start-app" data-launch="${k}">${ico(k)}<span>${n}</span></button>`).join('')||'<span>Нічого не знайдено</span>';$('apps').querySelectorAll('button').forEach(b=>b.onclick=()=>{let k=b.dataset.launch;if(k==='calc'||k==='chrome')launch(k,'start');else if(k==='folder'){feedback('Для цієї вправи відкрий папку «Матеріали проєкту» саме з робочого столу.','warn');hideMenus()}else feedback('Ця програма не потрібна у вправі. Знайди калькулятор.','warn')})}
function overview(){let was=$('overview').hidden;hideMenus();if(!was)return;let keys=Object.keys(state).filter(k=>state[k].open);$('overview').innerHTML=keys.map(k=>`<button data-view="${k}">${ico(k)}<b>${names[k]}</b></button>`).join('')||'<span style="color:white">Немає відкритих вікон</span>';$('overview').hidden=false;$('overview').querySelectorAll('button').forEach(b=>b.onclick=()=>{hideMenus();focus(b.dataset.view)});feedback('Перегляд завдань: вибери потрібне відкрите вікно.')}
function altTab(){let list=Object.keys(state).filter(k=>state[k].open).sort((a,b)=>state[b].z-state[a].z);if(list.length)focus(list[0]===active?list[1]||list[0]:list[0])}
function context(k,b){hideMenus();let m=$('menu');m.innerHTML=`<button id="pin">${pinned[k]?'Відкріпити':'Закріпити'} на панелі завдань</button><button id="ctxclose">Закрити вікно</button>`;m.hidden=false;m.style.bottom='7px';m.style.left=Math.min(W()-225,Math.max(4,b.getBoundingClientRect().left-desk.getBoundingClientRect().left))+'px';$('pin').onclick=()=>{if(stage===7&&k==='calc'&&!pinned.calc&&!flags.reopenedStart){hideMenus();feedback('Спочатку закрий незакріплений калькулятор і знову відкрий через «Пуск».','warn');return}pinned[k]=!pinned[k];if(stage===7&&k==='calc'&&pinned[k]&&flags.reopenedStart)flags.didPin=true;hideMenus();taskbar();feedback(pinned[k]?'Програму закріплено на панелі завдань.':'Програму відкріплено від панелі завдань.');check()};$('ctxclose').onclick=()=>{hideMenus();closeApp(k)}}
function startDrag(e,k,edge){if(e.button!==0)return;let s=state[k];if(s.max){if(edge==='move')feedback('Спочатку віднови розмір розгорнутого вікна кнопкою біля хрестика.');return}e.preventDefault();focus(k,false);dragging={k,edge,sx:e.clientX,sy:e.clientY,p:{...s.rect},moved:false};e.target.setPointerCapture?.(e.pointerId);feedback('')}
function move(e){if(!dragging)return;let d=dragging,s=state[d.k],dx=e.clientX-d.sx,dy=e.clientY-d.sy,p={...d.p},minW=Math.min(160,W()),minH=170;if(Math.abs(dx)+Math.abs(dy)>3)d.moved=true;if(d.edge==='move'){p.x=Math.max(0,Math.min(W()-p.w,p.x+dx));p.y=Math.max(0,Math.min(H()-p.h,p.y+dy))}else{if(d.edge.includes('e'))p.w=Math.max(minW,Math.min(W()-p.x,p.w+dx));if(d.edge.includes('s'))p.h=Math.max(minH,Math.min(H()-p.y,p.h+dy));if(d.edge.includes('w')){let end=p.x+p.w;p.x=Math.max(0,Math.min(end-minW,p.x+dx));p.w=end-p.x}if(d.edge.includes('n')){let end=p.y+p.h;p.y=Math.max(0,Math.min(end-minH,p.y+dy));p.h=end-p.y}}s.rect=p;draw(d.k);if(d.edge==='move'){let bounds=desk.getBoundingClientRect(),x=e.clientX-bounds.left;d.snap=x<12?'left':x>W()-12?'right':null;let pr=$('preview');if(d.snap){pr.style.display='block';Object.assign(pr.style,{left:(d.snap==='left'?0:W()/2)+'px',top:'0px',width:W()/2+'px',height:H()+'px'})}else pr.style.display='none'}}
function endDrag(){if(!dragging)return;let d=dragging;dragging=null;$('preview').style.display='none';if(d.snap&&d.moved){snapWindow(d.k,d.snap)}else if(d.moved){feedback('');check()}}
function snapWindow(k,side){let s=state[k];if(!s?.open)return;s.max=false;s.rect={x:side==='left'?0:Math.floor(W()/2),y:0,w:side==='left'?Math.floor(W()/2):W()-Math.floor(W()/2),h:H()};restored[k]=true;draw(k);feedback('Вікно розташовано у '+(side==='left'?'лівій':'правій')+' половині екрана.','good');check()}
function snapMenu(){let k=active;if(!k){feedback('Спочатку вибери вікно.','warn');return}let m=$('snap');m.hidden=false;m.style.right='12px';m.style.top='38px';m.innerHTML='<button data-side="left" title="Ліва половина">▌ ▫</button><button data-side="right" title="Права половина">▫ ▐</button>';m.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.hidden=true;snapWindow(k,b.dataset.side)})}
function adjacent(){let a=state.chrome,b=state.calc;if(!visible('chrome')||!visible('calc')||a.max||b.max)return false;let A=a.rect,B=b.rect;let left=A.x<B.x?A:B,right=A.x<B.x?B:A;let overlap=Math.max(0,Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y));if(right.x<left.x+left.w-3||right.x-left.x-left.w>W()*.20||overlap<Math.min(A.h,B.h)*.45)return false;for(let k of Object.keys(state)){if(k==='chrome'||k==='calc'||!visible(k))continue;let s=state[k],r=s.max?{x:0,y:0,w:W(),h:H()}:s.rect;for(let t of [a,b])if(s.z>t.z){let q=t.rect;if(Math.max(0,Math.min(r.x+r.w,q.x+q.w)-Math.max(r.x,q.x))*Math.max(0,Math.min(r.y+r.h,q.y+q.h)-Math.max(r.y,q.y))>q.w*q.h*.08)return false}}return true}
function threeVisible(){let ks=['folder','calc','chrome'];if(ks.some(k=>!visible(k)||state[k].max))return false;return ks.every((k,i)=>ks.slice(i+1).every(j=>{let a=state[k].rect,b=state[j].rect;let x=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)),y=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));return x*y<=Math.min(a.w*a.h,b.w*b.h)*.04}))}function vals(){if(stage===0)return ['folder','calc','chrome'].map(k=>!!opened[k]&&!!state[k]?.open);if(stage===1)return [!!restored.chrome,!!restored.calc,adjacent(),!!state.folder?.open&&!!state.folder?.min];if(stage===2)return [minimizedChrome,returnChrome];if(stage===3)return [!!flags.folderFound&&active==='folder'&&visible('folder'),!!state.chrome?.open&&!!state.calc?.open];if(stage===4)return [!!flags.folderRestored,!!flags.folderRestored&&!!flags.folderMax&&visible('folder')&&state.folder.max];if(stage===5)return [threeVisible()];if(stage===6)return [!!flags.deskShown,!!flags.deskReturned];if(stage===7)return [!!flags.unpinnedClosed,!!flags.reopenedStart,!!flags.didPin,!!flags.pinnedClosed,!!flags.reopenedTaskbar&&!!state.calc?.open&&!!pinned.calc];return []}
const skills=[['🚀','Старт'],['😎','Два вікна'],['🔄','Повернення'],['🕵️','Пошук'],['🔍','Повний екран'],['⚡','Мультитаскінг'],['🖥️','Робочий стіл'],['📌','Швидкий доступ']];
function renderSkills(){$('skillCount').textContent=stage+' / 8';$('skillGrid').innerHTML=skills.map((v,i)=>`<div class="skill-chip ${i<stage?'earned':''}" title="${i<stage?v[1]:'Ще не отримано'}">${i<stage?v[0]:'·'}</div>`).join('')}
function showWelcome(){ $('rewardIcon').textContent='👋';$('rewardKicker').textContent='DIGITAL START';$('rewardTitle').textContent='Привіт! Готовий налаштувати робочий простір?';$('rewardText').textContent='Потренуйся відкривати програми, керувати вікнами та налаштовувати панель завдань у симуляторі Windows. Виконай 8 завдань і збери всі емодзі. Якщо знадобиться допомога, натисни «Підказка».';$('rewardList').innerHTML='';$('rewardNext').textContent='Почати';$('rewardLayer').hidden=false;$('rewardNext').onclick=()=>{$('rewardLayer').hidden=true};$('rewardNext').focus()}
function showReward(i){let v=skills[i];$('rewardIcon').textContent=v[0];$('rewardKicker').textContent=(i+1)+' / 8';$('rewardTitle').textContent='Вітаю! Нова навичка';$('rewardText').textContent=['Тепер ти вмієш відкривати програми різними способами.','Тепер ти вмієш розташовувати два вікна поруч.','Тепер ти вмієш згортати й повертати вікна.','Тепер ти вмієш знаходити потрібне відкрите вікно.','Тепер ти вмієш змінювати режим відображення вікна.','Тепер ти вмієш працювати з трьома вікнами одночасно.','Тепер ти вмієш показувати робочий стіл і повертати вікна.','Тепер ти вмієш закріплювати програми на панелі завдань.'][i];$('rewardList').innerHTML='';$('rewardNext').textContent=stage===8?'Переглянути результат':'Продовжити';$('rewardLayer').hidden=false;$('rewardNext').onclick=()=>{if(stage===8)showFinal();else $('rewardLayer').hidden=true};$('rewardNext').focus()}
function showFinal(){$('rewardIcon').textContent='🏆';$('rewardKicker').textContent='8 / 8';$('rewardTitle').textContent='Вітаю! Робочий простір під контролем';$('rewardText').textContent='Ти зібрав усі 8 емодзі!';$('rewardList').innerHTML=skills.map(v=>`<div title="${v[1]}">${v[0]}</div>`).join('');$('rewardNext').textContent='Почати заново';$('rewardNext').onclick=()=>{$('resetBtn').click()};}
function renderStep(){ renderSkills();let s=stages[stage];$('progress').style.width=(stage/stages.length*100)+'%';if(!s){$('stepnum').textContent=stages.length+' із '+stages.length+' · Завершено';$('taskTitle').textContent='Усе готово!';$('taskText').textContent='Ти відкрив програми, налаштував вікна, показав робочий стіл і закріпив калькулятор на панелі завдань.';$('checks').innerHTML='';$('hintBtn').disabled=true;return}$('stepnum').textContent='Етап '+(stage+1)+' із '+stages.length;$('taskTitle').textContent=s.title;$('taskText').textContent=s.text;let v=vals();$('checks').innerHTML=s.items.map((t,i)=>`<div class="check ${v[i]?'done':''}"><span class="mark">${v[i]?'✓':''}</span><span>${t}</span></div>`).join('')}
function check(){if(stage>=stages.length)return;let v=vals();if(v.every(Boolean)){stage++;renderStep();showReward(stage-1);feedback('')}else renderStep()}
function calc(v){if(v==='C'||v==='CE'){calcValue='0';calcNum=null;calcOp=null;calcNew=false}else if(v==='⌫'){calcValue=calcValue.slice(0,-1)||'0'}else if(v==='±'){calcValue=String(-Number(calcValue))}else if(v==='%'){calcValue=String(Number(calcValue)/100)}else if(['÷','×','−','+','='].includes(v)){if(calcOp&&calcNum!==null&&!calcNew){let b=Number(calcValue);calcValue=String(calcOp==='÷'?calcNum/b:calcOp==='×'?calcNum*b:calcOp==='−'?calcNum-b:calcNum+b)}calcNum=v==='='?null:Number(calcValue);calcOp=v==='='?null:v;calcNew=true}else{if(calcNew){calcValue='0';calcNew=false}if(v===','){if(!calcValue.includes('.'))calcValue+='.'}else if(calcValue.length<16)calcValue=calcValue==='0'?v:calcValue+v}$('calcDisplay').textContent=calcValue.replace('.',',')}
$('startBtn').onclick=startMenu;$('searchBtn').onclick=startMenu;$('search').oninput=renderStart;$('search').onkeydown=e=>{if(e.key==='Enter'){let b=$('apps').querySelector('button');if(b)b.click()}};$('folderIcon').onclick=()=>{$('folderIcon').classList.add('selected');feedback('')};$('folderIcon').ondblclick=()=>launch('folder','desktop');$('folderIcon').onkeydown=e=>{if(e.key==='Enter')launch('folder','desktop')};$('showDesk').onclick=showDesktop;$('viewBtn').onclick=overview;$('hintBtn').onclick=()=>{if(stage<stages.length)feedback(stages[stage].hint)};$('resetBtn').onclick=()=>{$('rewardLayer').hidden=true;state={};opened={};restored={};pinned={chrome:true};flags={};stage=0;active=null;z=10;hiddenDesk=false;minimizedChrome=false;returnChrome=false;calcValue='0';calcNum=null;calcOp=null;calcNew=false;$('windows').innerHTML='';$('hintBtn').disabled=false;hideMenus();taskbar();renderStep();feedback('')};desk.addEventListener('pointerdown',e=>{if(e.target===desk||e.target.closest('.wallpaper'))hideMenus()});window.addEventListener('pointermove',move);window.addEventListener('pointerup',endDrag);window.addEventListener('keydown',e=>{if(!$('rewardLayer').hidden)return;if(e.key==='Escape')hideMenus();});window.addEventListener('resize',()=>{for(let k of Object.keys(state)){let p=state[k].rect;p.w=Math.min(p.w,W());p.h=Math.min(p.h,H());p.x=Math.max(0,Math.min(p.x,W()-p.w));p.y=Math.max(0,Math.min(p.y,H()-p.h));draw(k)}check()});taskbar();renderStep();feedback('');showWelcome();
</script></body></html>
